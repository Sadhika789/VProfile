name: CI Pipeline

on:
  push:
    branches:
      - master
jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins build
        run: |
          curl -u ${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }} \
            -X POST "${{ secrets.JENKINS_URL }}/job/vprofile/build"
  update-manifests:
    runs-on: ubuntu-latest
    needs: trigger-jenkins
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update image tag
        run: |
          sed -i "s|image: .*|image: ylakshmisadhika/vprofile:${{ github.run_number }}|g" src/k8s/deployment.yaml

      - name: Commit and push changes
        run: |
          git config user.email "ci-bot@temenos.com"
          git config user.name "CI Bot"
          git add src/k8s/deployment.yaml
          git commit -m "Update image tag to ${{ github.run_number }}"
          git push origin master
