name: Trigger build
# on: 
#  push:
#   branches:
#    - master
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
         curl -X POST "$JENKINS_URL/job/<job-name>/build" \
          --user "$JENKINS_USER:$JENKINS_TOKEN"
        
